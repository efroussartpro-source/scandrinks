<!doctype html>
<!--
  tutoriel/index.html — Page de la vidéo tuto, ouverte par le QR code de la feuille de la réserve.

  Référence : docs/superpowers/specs/2026-10-19-scandrinks-design.md (§6.2, §7, §9 « Mise en service »)

  Page statique, copiée telle quelle par Vite. Le lecteur natif de l'iPhone
  lit la liste HLS ; rien n'est chargé avant le toucher de lecture. Si la
  vidéo ne se charge pas, un message et « Réessayer » s'affichent. Les
  adresses et les textes sont ceux de src/settings/tutorial.ts
  (tutorial.test.ts vérifie qu'ils restent d'accord) ; les couleurs, celles
  de la charte (§6.7), jour et nuit.
-->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <title>ScanDrinks — Tutoriel</title>
    <style>
      :root {
        --bg: #f2f2f7;
        --text: #1c1c1e;
        --text-2: #6c6c70;
        --link: #1f6f3f;
        --red-text: #c0392b;
        --red-pale: #fdecea;
        --green-pale: #e7f1eb;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #000000;
          --text: #ffffff;
          --text-2: #98989f;
          --link: #4cd07d;
          --red-text: #ff6961;
          --red-pale: #3a1d1b;
          --green-pale: #1e3326;
        }
      }

      body {
        margin: 0;
        padding: calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
          calc(24px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
        background: var(--bg);
        color: var(--text);
        font: 17px/1.4 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        -webkit-text-size-adjust: 100%;
      }

      main {
        max-width: 560px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      h1 {
        margin: 0;
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.5px;
        line-height: 1.15;
      }

      p {
        margin: 0;
      }

      .subtitle {
        font-size: 15px;
        color: var(--text-2);
      }

      video {
        display: block;
        width: 100%;
        aspect-ratio: 9 / 16;
        max-height: 70vh;
        border-radius: 18px;
        background: #000000;
      }

      .message {
        padding: 12px 14px;
        border-radius: 14px;
        background: var(--red-pale);
        color: var(--red-text);
        font-size: 15px;
      }

      /* Vidéo injoignable : le message, puis « Réessayer » (un display ici effacerait l'attribut hidden). */
      #failed:not([hidden]) {
        display: grid;
        gap: 12px;
        scroll-margin-bottom: 16px;
      }

      button {
        min-height: 48px;
        padding: 0 16px;
        border: none;
        border-radius: 14px;
        background: var(--green-pale);
        color: var(--link);
        font: inherit;
        font-weight: 600;
      }

      a {
        align-self: flex-start;
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        color: var(--link);
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tutoriel ScanDrinks</h1>
      <p class="subtitle">Environ 3 minutes, sans le son : tout est écrit.</p>
      <video
        controls
        playsinline
        preload="none"
        poster="/tutoriel/video/poster.jpg"
        src="/tutoriel/video/tutoriel.m3u8"
        aria-label="Vidéo tuto"
      ></video>
      <p id="unsupported" class="message" hidden>Ouvre cette page sur un iPhone pour voir la vidéo.</p>
      <div id="failed" hidden>
        <p class="message" role="alert">La vidéo ne se charge pas. Vérifie la connexion, puis réessaie.</p>
        <button type="button">Réessayer</button>
      </div>
      <a href="/">Ouvrir ScanDrinks</a>
    </main>
    <script>
      // Un navigateur qui ne lit pas le HLS le dit tout de suite ; une vidéo injoignable, à l'essai de lecture. Le
      // message vient sous un grand lecteur : on l'amène à l'écran, avec « Réessayer ».
      const video = document.querySelector('video')
      const failed = document.getElementById('failed')
      if (video.canPlayType('application/vnd.apple.mpegurl') === '') document.getElementById('unsupported').hidden = false
      video.addEventListener('error', () => {
        failed.hidden = false
        failed.scrollIntoView({ block: 'nearest' })
      })
      // Un lecteur en échec refuse toute nouvelle lecture sans rien recharger : load() le remet à zéro, et play()
      // relance le chargement dans le même toucher. Un nouvel échec rouvre le message.
      failed.querySelector('button').addEventListener('click', () => {
        failed.hidden = true
        video.load()
        const playing = video.play()
        if (playing) playing.catch(() => {})
      })
    </script>
  </body>
</html>
